name: release
on:
  push:
    branches:
      - main
      - develop

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.9.15
      with:
        versionSpec: '5.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0.9.15
    - name: Setup .NET SDK 9.0.x
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9   
    - name: Install dependencies
      run: dotnet restore
    - name: Format
      run: dotnet format --verify-no-changes
    - name: Build
      run: dotnet build --configuration Release --no-restore --WarnAsError /p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }}
    - name: Pack nuget
      run: dotnet pack --no-build -IncludeReferencedProjects --configuration Release /p:Version=${{ steps.gitversion.outputs.NuGetVersionV2 }}
    - name: Push nuget
      run: dotnet nuget push "src/Imget.Shared/bin/Release/*.nupkg" --api-key ${{ secrets.NUGETKEY }} --source "https://api.nuget.org/v3/index.json"